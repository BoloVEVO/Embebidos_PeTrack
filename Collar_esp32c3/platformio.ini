; Collar (ESP32-C3 SUPERMINI) — beacon BLE del Sistema de detección de mascotas
; P1: compila esqueleto. P2: beacon BLE (NimBLE) cada 5 s.
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1
